<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Maps</title>

    <!-- MapLibre CSS -->
    <link
            href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
            rel="stylesheet"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- MapLibre JS -->
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

<script>
    const map = new maplibregl.Map({
        container: 'map',

        style: './style_gta_sa.json',

        center: [30.7133, 36.8969],

        zoom: 12
    });

    map.addControl(
        new maplibregl.NavigationControl(),
        'top-right'
    );
</script>

</body>
</html>
