<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Maps</title>

    <!-- MapLibre CSS -->
    <link
        href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>


<body>

<div id="map"></div>


<!-- MapLibre JS -->
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>


<script>

    // =====================================================
    // MAP
    // =====================================================

    const map = new maplibregl.Map({

        container: 'map',

        style: './style_gta_sa.json',

        center: [30.7133, 36.8969],

        zoom: 12

    });


    // =====================================================
    // CONTROLS
    // =====================================================

    map.addControl(
        new maplibregl.NavigationControl(),
        'top-right'
    );


    // =====================================================
    // MAP LOADED
    // =====================================================

    map.on('load', async () => {

        console.log('Map loaded');


        try {

            // =================================================
            // LOAD FOOD ICON
            // =================================================

            const image = await map.loadImage(
                './assets/icons/food.png?v=' + Date.now()
            );


            console.log('Food icon loaded');


            // =================================================
            // ADD IMAGE TO MAP
            // =================================================

            if (map.hasImage('food')) {

                map.removeImage('food');

            }


            map.addImage(
                'food',
                image.data
            );


            console.log('Food icon registered');


            // =================================================
            // ADD FOOD LAYER
            // =================================================

            map.addLayer({

                id: 'game-food',

                type: 'symbol',

                source: 'openmaptiles',

                'source-layer': 'poi',

                minzoom: 15,

                filter: [

                    'any',

                    // restaurant
                    [
                        '==',
                        ['get', 'class'],
                        'restaurant'
                    ],

                    // fast food
                    [
                        '==',
                        ['get', 'class'],
                        'fast_food'
                    ],

                    // fast food через subclass
                    [
                        '==',
                        ['get', 'subclass'],
                        'fast_food'
                    ]

                ],

                layout: {

                    'icon-image': 'food',

                    'icon-size': 1,

                    'icon-allow-overlap': true,

                    'icon-ignore-placement': true

                }

            });


            console.log('Food layer added');


        } catch (error) {

            console.error(
                'FOOD ICON ERROR:',
                error
            );

        }

    });

</script>


</body>

</html>
